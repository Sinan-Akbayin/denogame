function resize() {
  const wrap = document.getElementById('wrap');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}

const C = {
  wall: '#eee8dc', wood: '#aa7346', woodD: '#8c5a37', skin: '#f2c8a8',
  hairD: '#2d2019', hairB: '#965f32', orange: '#f58c28', black: '#202026',
  maroon: '#6e1e30', onesie: '#cddcc3', pink: '#f05a8c', white: '#ffffff',
  yellow: '#ffd73c', red: '#dc3232', wing: '#6e3c8c'
};
const ART = ['#78bedc', '#f0c85a', '#c85a50', '#6ea06e', '#aa82c8'];

// ---------------------------------------------------------------- ses
let AC = null;
function beep(f, d, type = 'sine', v = 0.06) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}

// ---------------------------------------------------------------- çizim yardımcıları
function circle(x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ell(x, y, rx, ry, col, rot = 0) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); }
function poly(pts, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) ctx.lineTo(p[0], p[1]); ctx.closePath(); ctx.fill(); }
function rrect(x, y, w, h, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }

function text(s, size, col, x, y, align = 'center') {
  ctx.font = `800 ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 7);
  ctx.strokeStyle = '#3a2620'; ctx.strokeText(s, x, y);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}

function face(img, x, y, r, ring = C.white) {
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.closePath(); ctx.clip();
  if (img.complete && img.naturalWidth) ctx.drawImage(img, x - r, y - r, r * 2, r * 2);
  else { ctx.fillStyle = C.skin; ctx.fill(); }
  ctx.restore();
  ctx.lineWidth = Math.max(2, r / 10); ctx.strokeStyle = ring;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
}

function heart(x, y, r, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x, y + r);
  ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.7, y - r * 1.4, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.7, y - r * 1.4, x + r * 1.6, y - r * 0.2, x, y + r);
  ctx.fill();
}

function drawBackground(off) {
  ctx.fillStyle = C.wall; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 6; i++) {
    const x = ((i * 200 - off * 0.25) % 1200 + 1200) % 1200 - 120;
    const y = 50 + (i * 37) % 70;
    ctx.fillStyle = '#3c2d1e'; ctx.fillRect(x - 5, y - 5, 80, 100);
    ctx.fillStyle = ART[i % ART.length]; ctx.fillRect(x, y, 70, 90);
    circle(x + 35, y + 40, 14, '#faf0dc');
  }
  for (let i = 0; i < 4; i++) {
    const x = ((i * 320 - off * 0.5) % 1280 + 1280) % 1280 - 160;
    for (let k = 0; k < 7; k++) {
      const a = -Math.PI / 2 + (k - 3) * 0.35;
      ell(x + Math.cos(a) * 55, 360 + Math.sin(a) * 90, 14, 30, '#3c8246', a + Math.PI / 2);
    }
    poly([[x - 30, 400], [x + 30, 400], [x + 22, 460], [x - 22, 460]], '#be643c');
  }
  ctx.fillStyle = C.wood; ctx.fillRect(0, 460, W, 80);
  ctx.strokeStyle = C.woodD; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, 460); ctx.lineTo(W, 460); ctx.stroke();
  ctx.lineWidth = 2;
  for (let i = 0; i < 12; i++) {
    const x = ((i * 100 - off) % 1200 + 1200) % 1200 - 100;
    ctx.beginPath(); ctx.moveTo(x, 462); ctx.lineTo(x - 30, 540); ctx.stroke();
  }
}

function drawDeniz(x, y, t, blink) {
  if (blink && Math.floor(t / 4) % 2 === 0) return;
  const w = Math.sin(t * 0.5) * 10;
  ell(x - 47, y - 11 - w, 18, 11, C.white);
  ell(x + 47, y - 11 - w, 18, 11, C.white);
  ctx.strokeStyle = '#19191e'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.ellipse(x, y - 18, 44, 40, 0, Math.PI + 0.1, Math.PI * 2 - 0.1); ctx.stroke();
  ell(x, y + 1, 40, 35, '#28282e');
  ell(x, y + 2, 32, 28, '#3e3e46');
  ell(x, y + 11, 20, 17, C.onesie);
  circle(x - 10, y + 26, 7, C.white);
  circle(x + 10, y + 26, 7, C.white);
  face(IMG.deniz, x, y - 16, 22);
}

function drawPerson(x, y, t, o) {
  const s = o.s || 1;
  if (o.monster) {
    const f = Math.sin(t * 0.3) * 10 * s;
    for (const side of [-1, 1]) {
      poly([[x + side * 20 * s, y + 10 * s], [x + side * 66 * s, y - 14 * s - f],
            [x + side * 56 * s, y + 18 * s], [x + side * 40 * s, y + 6 * s]], C.wing);
    }
  }
  if (o.hair === 'curly') {
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * Math.PI * 2;
      circle(x + Math.cos(a) * 28 * s, y - 14 * s + Math.sin(a) * 28 * s, 12 * s, C.hairB);
    }
    for (let j = 0; j < 5; j++) for (const side of [-1, 1]) circle(x + side * (30 + j * 2) * s, y + j * 12 * s, 12 * s, C.hairB);
  } else if (o.hair === 'long') {
    ell(x, y - 4 * s, 31 * s, 36 * s, C.hairD);
  }
  ell(x, y + 27 * s, 28 * s, 23 * s, o.shirt);
  if (o.patch) {
    ctx.fillStyle = '#ebebeb'; ctx.fillRect(x - 20 * s, y + 18 * s, 14 * s, 16 * s);
    ctx.fillStyle = C.orange; ctx.fillRect(x - 18 * s, y + 26 * s, 10 * s, 6 * s);
  }
  face(o.img, x, y - 14 * s, 26 * s);
  if (o.crown) {
    poly([[x - 22 * s, y - 36 * s], [x - 22 * s, y - 58 * s], [x - 11 * s, y - 47 * s], [x, y - 64 * s],
          [x + 11 * s, y - 47 * s], [x + 22 * s, y - 58 * s], [x + 22 * s, y - 36 * s]], C.yellow);
  } else if (o.monster) {
    for (const side of [-1, 1]) {
      poly([[x + side * 20 * s, y - 32 * s], [x + side * 15 * s, y - 54 * s], [x + side * 6 * s, y - 37 * s]], C.red);
    }
  }
  if (o.name) text(o.name, 20, C.white, x, y - 68 * s);
}

function drawEmzik(x, y, t) {
  y += Math.sin(t * 0.1) * 4;
  ctx.strokeStyle = '#ffc850'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y - 17, 8, 0, Math.PI * 2); ctx.stroke();
  circle(x, y, 13, '#5aaaf0');
  ctx.strokeStyle = C.white; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2); ctx.stroke();
  circle(x, y + 13, 6, '#fae1be');
}

function drawBottle(x, y) {
  ell(x, y - 25, 6, 7, '#f0aa5a');
  rrect(x - 11, y - 21, 22, 8, 2, '#5aaaf0');
  rrect(x - 10, y - 14, 20, 36, 5, C.white);
  rrect(x - 8, y, 16, 20, 3, '#faf5dc');
  ctx.strokeStyle = '#a0bedc'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x - 10, y - 14, 20, 36, 5); ctx.stroke();
}

function drawDilan(x, y, t) {
  const s = 1.3;
  drawPerson(x, y, t, { shirt: C.maroon, img: IMG.dilan, name: 'Dilan Anne', s, hair: 'long' });
  const bx = x - 50 * s, by = y - 30 * s + Math.sin(t * 0.08) * 5;
  ctx.strokeStyle = C.maroon; ctx.lineWidth = 12; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - 20 * s, y + 14 * s); ctx.lineTo(bx + 6, by + 14); ctx.stroke();
  ctx.lineCap = 'butt';
  drawBottle(bx, by);
  heart(x + 52, y - 92 + Math.sin(t * 0.1) * 6, 10, C.pink);
}

const SEZGIN = { shirt: C.orange, name: 'Sezgin Amca', monster: true };
const NAZIM = { shirt: C.black, name: 'Nazım Baba', monster: true, patch: true };

// ---------------------------------------------------------------- nesneler
class Enemy {
  constructor(kind, prog) {
    this.kind = kind;
    this.x = W + 80;
    this.base = 90 + Math.random() * 300;
    this.y = this.base;
    this.t = Math.random() * 6.28;
    this.vx = kind === 'sezgin' ? 3.5 + 2 * prog : 4.5 + 2.5 * prog;
    this.r = 32;
  }
  update(by) {
    this.x -= this.vx; this.t += 0.06;
    if (this.kind === 'sezgin') this.y = this.base + Math.sin(this.t) * 70;   // dalga gibi
    else this.y += (by - this.y) * 0.012;                                      // takip eder
  }
  draw(t) {
    const o = this.kind === 'sezgin' ? SEZGIN : NAZIM;
    o.img = IMG[this.kind];
    drawPerson(this.x, this.y, t, o);
  }
}

class Boss {
  constructor() { this.x = W + 150; this.y = H / 2; this.hp = this.max = 25; this.t = 0; this.cool = 90; this.flash = 0; }
  get ready() { return this.x <= W - 160; }
  update() {
    this.t += 0.02;
    if (this.x > W - 160) this.x -= 2;
    this.y = 250 + Math.sin(this.t * 1.6) * 140;
    this.cool--; if (this.flash > 0) this.flash--;
  }
  draw(t) {
    drawPerson(this.x, this.y, t, { shirt: '#4b3a30', img: IMG.cansu, s: 2, hair: 'curly', crown: true, monster: true });
    if (this.flash) { ctx.strokeStyle = C.white; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(this.x, this.y, 88, 0, Math.PI * 2); ctx.stroke(); }
  }
}

  burst(x, y, col, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, v = 1 + Math.random() * 4;
      this.parts.push([x, y, Math.cos(a) * v, Math.sin(a) * v, 30, col]);
    }
  },
  tap() {
    if (['menu', 'over', 'win'].includes(this.state)) {
      if (this.endWait > 0) return;
      this.reset(); this.state = 'play';
      this.say('Deniz yola çıktı, biberona ulaş!');
      beep(520, 0.15);
    } else {
      this.vy = -7.5;
      beep(660, 0.08, 'triangle', 0.04);
    }
  },
  hurt() {
    if (this.inv > 0) return;
    this.lives--; this.inv = 90;
    this.burst(this.bx, this.by, '#ff5050');
    beep(160, 0.25, 'square', 0.05);
    if (this.lives <= 0) { this.finish('over'); }
  },
  finish(st) {
    this.state = st; this.endWait = 60;
    if (this.score > best) { best = this.score; try { localStorage.setItem('deniz-best', String(best)); } catch (e) {} }
  },
  update() {
    this.t++;
    if (this.endWait > 0) this.endWait--;
    if (this.msgT > 0) this.msgT--;
    for (const p of this.parts) { p[0] += p[2]; p[1] += p[3]; p[3] += 0.15; p[4]--; }
    this.parts = this.parts.filter(p => p[4] > 0);
    if (!['play', 'boss', 'ending'].includes(this.state)) { this.scroll += 1; return; }

    const speed = this.state === 'play' ? 4 : 1.5;
    this.scroll += speed;
    this.vy = Math.min(this.vy + 0.38, 9);
    this.by += this.vy;
    if (this.by < 45) { this.by = 45; this.vy = 0; }
    if (this.by > 425) { this.by = 425; this.vy = -5; }
    if (this.inv > 0) this.inv--;

    if (this.state === 'play') {
      this.frame++;
      const prog = Math.min(1, this.frame / LEVEL);
      if (this.frame < LEVEL) {
        if (--this.spawn <= 0) {
          this.enemies.push(new Enemy(Math.random() < 0.5 ? 'sezgin' : 'nazim', prog));
          this.spawn = Math.floor(95 - 45 * prog) + Math.floor(Math.random() * 30);
        }
        if (--this.itemSpawn <= 0) {
          this.items.push([W + 30, 80 + Math.random() * 320]);
          this.itemSpawn = 120 + Math.floor(Math.random() * 100);
        }
      }
      if (this.frame === Math.floor(LEVEL / 2)) this.say('Yarı yoldasın!');
      if (this.frame >= LEVEL && this.enemies.length === 0) {
        this.state = 'boss'; this.boss = new Boss(); this.items = [];
        this.say('Dikkat! Cansu Hala geliyor!');
        beep(220, 0.5, 'sawtooth', 0.05);
      }
    }

    for (const e of this.enemies) {
      e.update(this.by);
      if (Math.hypot(e.x - this.bx, e.y - this.by) < e.r + 24) this.hurt();
      if (e.x < -80) this.score += 1;
    }
    this.enemies = this.enemies.filter(e => e.x >= -80);

    for (const it of this.items) {
      it[0] -= speed;
      if (Math.hypot(it[0] - this.bx, it[1] - this.by) < 38) {
        this.score += 10; this.burst(it[0], it[1], C.yellow, 10); it[0] = -999;
        beep(880, 0.1, 'sine', 0.05);
      }
    }
    this.items = this.items.filter(it => it[0] > -50);

    const b = this.boss;
    if (this.state === 'boss') {
      b.update();
      if (b.ready && b.cool <= 0) {
        const base = Math.atan2(this.by - b.y, this.bx - b.x);
        const angles = b.hp > b.max / 2 ? [0] : [-0.28, 0, 0.28];
        for (const a of angles) this.kisses.push([b.x - 40, b.y, Math.cos(base + a) * 5, Math.sin(base + a) * 5]);
        b.cool = b.hp > b.max / 2 ? 75 : 50;
        beep(400, 0.12, 'sine', 0.04);
      }
      if (--this.fire <= 0) { this.bubbles.push([this.bx + 35, this.by - 8]); this.fire = 22; }
      for (const bub of this.bubbles) {
        bub[0] += 9;
        if (b.ready && Math.hypot(bub[0] - b.x, bub[1] - b.y) < 70) {
          b.hp--; b.flash = 6; this.score += 2;
          this.burst(bub[0], bub[1], C.white, 6); bub[0] = W + 999;
          beep(300 + b.hp * 10, 0.06, 'triangle', 0.04);
        }
      }
      this.bubbles = this.bubbles.filter(x => x[0] < W + 30);
      if (Math.hypot(b.x - this.bx, b.y - this.by) < 80) this.hurt();
      if (b.hp <= 0) {
        this.state = 'ending'; this.score += 100;
        this.kisses = []; this.bubbles = [];
        this.burst(b.x, b.y, C.pink, 40);
        this.say('Cansu Hala yenildi! Şimdi anneye uç!');
        beep(523, 0.15); setTimeout(() => beep(659, 0.15), 150); setTimeout(() => beep(784, 0.3), 300);
      }
    }

    if (this.state === 'ending') {
      b.x += 2; b.y += 5;
      if (this.momX > W - 150) this.momX -= 3;
      if (this.bx < this.momX - 120) this.bx += 2.5;
      const bx = this.momX - 65, by = 300 - 39;
      if (Math.hypot(bx - this.bx, by - this.by) < 60) {
        this.finish('win');
        this.burst(bx, by, C.pink, 50);
        [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.25), i * 160));
      }
    }

    for (const k of this.kisses) {
      k[0] += k[2]; k[1] += k[3];
      if (Math.hypot(k[0] - this.bx, k[1] - this.by) < 30) { this.hurt(); k[0] = -999; }
    }
    this.kisses = this.kisses.filter(k => k[0] > -40 && k[0] < W + 40 && k[1] > -40 && k[1] < H + 40);
  },

  draw() {
    drawBackground(this.scroll);
    if (this.state === 'menu') { this.drawMenu(); return; }
    for (const it of this.items) drawEmzik(it[0], it[1], this.t);
    for (const e of this.enemies) e.draw(this.t);
    if (this.boss && this.boss.y < H + 200) this.boss.draw(this.t);
    if (this.state === 'ending' || this.state === 'win') drawDilan(this.momX, 300, this.t);
    for (const k of this.kisses) heart(k[0], k[1], 13, C.pink);
    for (const bub of this.bubbles) {
      circle(bub[0], bub[1], 9, C.white);
      ctx.strokeStyle = '#96c8f0'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(bub[0], bub[1], 9, 0, Math.PI * 2); ctx.stroke();
    }
    drawDeniz(this.bx, this.by, this.t, this.inv > 0);
    for (const p of this.parts) circle(p[0], p[1], 4, p[5]);
    this.drawHud();
    if (this.state === 'over') this.overlay('Eyvah!', 'Deniz yakalandı…', 'Tekrar denemek için dokun');
    else if (this.state === 'win') this.overlay('Tebrikler Deniz!', 'Biberonuna kavuştun!', 'Yeniden oynamak için dokun');
  },

  drawHud() {
    for (let i = 0; i < 3; i++) heart(30 + i * 34, 30, 13, i < this.lives ? C.red : '#b4aaaa');
    text('Puan: ' + this.score, 30, C.yellow, W - 20, 32, 'right');
    if (this.state === 'play') {
      const prog = Math.min(1, this.frame / LEVEL);
      rrect(330, 20, 300, 20, 10, '#3c3232');
      if (prog > 0.03) rrect(330, 20, 300 * prog, 20, 10, C.pink);
      text('Biberona mesafe', 18, C.white, 480, 54);
    } else if (this.state === 'boss' && this.boss) {
      const b = this.boss;
      rrect(300, 18, 360, 22, 10, '#3c3232');
      if (b.hp > 0) rrect(300, 18, 360 * b.hp / b.max, 22, 10, C.red);
      text('Cansu Hala', 18, C.white, 480, 54);
    }
    if (this.msgT > 0) text(this.msg, 34, C.white, W / 2, 110);
  },

  overlay(a, b, c) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
    text(a, 68, C.yellow, W / 2, 180);
    text(b, 36, C.white, W / 2, 252);
    text('Puan: ' + this.score + '    En iyi: ' + best, 30, C.white, W / 2, 305);
    if (this.endWait === 0) text(c, 24, C.white, W / 2, 380);
  },

  drawMenu() {
    text('Deniz’in Biberon Macerası', 62, C.yellow, W / 2, 72);
    drawDeniz(140, 300 + Math.sin(this.t * 0.08) * 10, this.t);
    text('Deniz', 20, C.white, 140, 372);
    drawPerson(310, 300, this.t, Object.assign({}, SEZGIN, { img: IMG.sezgin }));
    drawPerson(470, 300, this.t, Object.assign({}, NAZIM, { img: IMG.nazim }));
    drawPerson(645, 300, this.t, { shirt: '#4b3a30', img: IMG.cansu, name: 'Cansu Hala', s: 1.3, hair: 'curly', crown: true, monster: true });
    drawDilan(835, 300, this.t);
    text('Ekrana dokun, Deniz uçsun. Emzikleri topla, yaratıklardan kaç!', 22, C.white, W / 2, 432);
    if (Math.floor(this.t / 30) % 2 === 0) text('Başlamak için dokun', 34, C.white, W / 2, 490);
    if (best > 0) text('En iyi: ' + best, 20, C.yellow, W - 20, 24, 'right');
  }
};
G.reset();

// ---------------------------------------------------------------- giriş
let lastTap = 0;
function onTap(e) {
  if (e) e.preventDefault();
  const now = performance.now();
  if (now - lastTap > 80) { lastTap = now; G.tap(); }
}
window.addEventListener('pointerdown', onTap, { passive: false });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); onTap(); }
});
document.addEventListener('gesturestart', e => e.preventDefault());

// ---------------------------------------------------------------- döngü (60 adım/sn, ekran hızından bağımsız)
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { G.update(); acc -= 1000 / 60; }
  G.draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__G = G;
</script>
