let AC = null;
function beep(f, d, type = 'sine', v = 0.06) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}
const tune = (notes, gap = 150) => notes.forEach((f, i) => setTimeout(() => beep(f, 0.22), i * gap));

function note(m, t, d, type, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}

const Music = {
  want: null, cur: null, timer: null, voices: [],
  play(name) {
    this.want = name;
    if (this.cur === name && this.timer) return;
    this.halt();
    if (!name || SAVE.mute || !TRACKS[name]) return;
    try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    const tr = TRACKS[name], step = 60 / tr.bpm / 2;
    this.cur = name;
    this.voices = tr.voices.map(v => ({ v, i: 0, t: AC.currentTime + 0.1 }));
    this.timer = setInterval(() => {
      if (AC.state !== 'running') return;
      for (const vc of this.voices) {
        if (vc.t < AC.currentTime) vc.t = AC.currentTime + 0.05;
        while (vc.t < AC.currentTime + 0.3) {
          const [n, len] = vc.v.notes[vc.i];
          if (n) note(n, vc.t, len * step * 0.9, vc.v.type, vc.v.vol);
          vc.t += len * step; vc.i = (vc.i + 1) % vc.v.notes.length;
        }
      }
    }, 60);
  },
  halt() { clearInterval(this.timer); this.timer = null; this.cur = null; },
  stop() { this.want = null; this.halt(); },
  toggle() { SAVE.mute = !SAVE.mute; persist(); const w = this.want; this.halt(); if (!SAVE.mute) this.play(w); }
};

function lerpCol(a, b, k) {
  const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return 'rgb(' + pa.map((v, i) => Math.round(v + (pb[i] - v) * k)).join(',') + ')';
}
const easeBack = e => { const c = 1.7; return 1 + (c + 1) * Math.pow(e - 1, 3) + c * Math.pow(e - 1, 2); };

// ================================================================ çizim yardımcıları
function circle(x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ring(x, y, r, col, w) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); }
function ell(x, y, rx, ry, col, rot = 0) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); }
function poly(pts, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) ctx.lineTo(p[0], p[1]); ctx.closePath(); ctx.fill(); }
function rrect(x, y, w, h, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
const wrapX = (v, span) => ((v % span) + span) % span;

function text(s, size, col, x, y, align = 'center') {
  ctx.font = `800 ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 7);
  ctx.strokeStyle = C.ink; ctx.strokeText(s, x, y);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}

function face(img, x, y, r, rc = C.white) {
  const tt = typeof G !== 'undefined' ? G.t : 0;
  y += Math.sin(tt * 0.1 + x * 0.02) * r * 0.04;                 // hafif kafa sallama
  const tilt = Math.sin(tt * 0.07 + x * 0.013) * 0.1;
  circle(x + r * 0.08, y + r * 0.16, r * 1.06, 'rgba(0,0,0,0.25)');  // gölge
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.closePath(); ctx.clip();
  if (img && img.complete && img.naturalWidth) {
    ctx.translate(x, y); ctx.rotate(tilt);
    ctx.drawImage(img, -r * 1.1, -r * 1.1, r * 2.2, r * 2.2);
  } else { ctx.fillStyle = C.skin; ctx.fill(); }
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
  const gl = ctx.createLinearGradient(x, y - r, x, y + r);
  gl.addColorStop(0, 'rgba(255,255,255,0.18)'); gl.addColorStop(0.45, 'rgba(255,255,255,0)'); gl.addColorStop(1, 'rgba(0,0,0,0.12)');
  ctx.fillStyle = gl; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.restore();
  const lw = Math.max(2, r / 10);
  ring(x, y, r + lw * 0.9, C.ink, Math.max(1.5, lw * 0.7));
  ring(x, y, r, rc, lw);
}

function heart(x, y, r, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x, y + r);
  ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.7, y - r * 1.4, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.7, y - r * 1.4, x + r * 1.6, y - r * 0.2, x, y + r);
  ctx.fill();
}

function star(x, y, r, fill) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
  }
  ctx.lineJoin = 'round';
  poly(pts, fill);
  ctx.strokeStyle = C.ink; ctx.lineWidth = Math.max(2, r / 8);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) ctx.lineTo(p[0], p[1]); ctx.closePath(); ctx.stroke();
}

function speech(txt, x, y) {   // (x,y) = konuşanın ağzı; balon solda durur
  ctx.font = `700 20px ${FONT}`;
  const w = ctx.measureText(txt).width + 30, h = 40;
  const bx = Math.max(10, Math.min(W - w - 10, x - w - 30));
  const by = Math.max(68, Math.min(H - 130, y - 70));
  rrect(bx, by, w, h, 14, C.white);
  poly([[bx + w - 30, by + h - 2], [bx + w - 8, by + h - 2], [x - 20, y - 10]], C.white);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.roundRect(bx, by, w, h, 14); ctx.stroke();
  ctx.fillStyle = C.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, bx + 15, by + h / 2 + 1);
}

function button(b) {
  const sc = b.sc === undefined ? 1 : b.sc;
  ctx.save(); ctx.translate(b.x + b.w / 2, b.y + b.h / 2); ctx.scale(sc, sc); ctx.translate(-(b.x + b.w / 2), -(b.y + b.h / 2));
  rrect(b.x, b.y + 5, b.w, b.h, 16, 'rgba(58,38,32,0.6)');
  rrect(b.x, b.y, b.w, b.h, 16, b.col || C.yellow);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 16); ctx.stroke();
  ctx.font = `800 26px ${FONT}`; ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 2);
  ctx.restore();
}

// ================================================================ arka planlar
function plant(x, flowers) {
  for (let k = 0; k < 7; k++) {
    const a = -Math.PI / 2 + (k - 3) * 0.35;
    ell(x + Math.cos(a) * 50, 365 + Math.sin(a) * 80, 13, 28, '#3c8246', a + Math.PI / 2);
  }
  if (flowers) for (let k = 0; k < 5; k++) {
    const a = -Math.PI / 2 + (k - 2) * 0.5;
    circle(x + Math.cos(a) * 70, 365 + Math.sin(a) * 95, 11, '#e0414f');
    circle(x + Math.cos(a) * 70, 365 + Math.sin(a) * 95, 4, '#ffd0d0');
  }
  poly([[x - 30, 400], [x + 30, 400], [x + 22, 460], [x - 22, 460]], flowers ? '#c4703f' : '#be643c');
}

function woodFloor(off) {
  ctx.fillStyle = C.wood; ctx.fillRect(0, 460, W, 80);
  ctx.strokeStyle = C.woodD; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, 460); ctx.lineTo(W, 460); ctx.stroke();
  ctx.lineWidth = 2;
  for (let i = 0; i < 12; i++) {
    const x = wrapX(i * 100 - off, 1200) - 100;
    ctx.beginPath(); ctx.moveTo(x, 462); ctx.lineTo(x - 30, 540); ctx.stroke();
  }
}

const FRAME_FACES = ['dilan', 'nazim', 'cansu', 'sezgin', 'deniz'];
function drawHome(off, t) {
  ctx.fillStyle = '#dbe8f1'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#c6d8e6'; ctx.fillRect(0, 320, W, 140);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 316, W, 6);
  // pencereler
  for (let i = 0; i < 3; i++) {
    const x = wrapX(i * 420 - off * 0.25, 1260) - 150;
    rrect(x - 6, 54, 142, 132, 6, '#ffffff');
    const g = ctx.createLinearGradient(0, 60, 0, 180); g.addColorStop(0, '#8fd0f5'); g.addColorStop(1, '#d6f0fb');
    ctx.fillStyle = g; ctx.fillRect(x, 60, 130, 120);
    ell(x + 40 + Math.sin(t * 0.01 + i) * 10, 95, 22, 10, '#ffffff');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 62, 60, 6, 120); ctx.fillRect(x, 117, 130, 6);
    ell(x - 4, 120, 16, 72, '#f2a7b8'); ell(x + 134, 120, 16, 72, '#f2a7b8');
  }
  // aile fotoğrafları
  for (let i = 0; i < 5; i++) {
    const x = wrapX(i * 250 + 200 - off * 0.25, 1250) - 120;
    const y = 90 + (i % 2) * 70;
    rrect(x - 34, y - 40, 68, 80, 4, '#6b4a2e');
    rrect(x - 28, y - 34, 56, 68, 2, '#fff7e8');
    face(IMG[FRAME_FACES[i]], x, y, 22, '#e8d8bf');
  }
  for (let i = 0; i < 4; i++) plant(wrapX(i * 320 - off * 0.5, 1280) - 160, false);
  woodFloor(off);
}

function drawAnane(off, t) {
  ctx.fillStyle = '#f0dac6'; ctx.fillRect(0, 0, W, H);
  // çiçekli duvar kağıdı
  const sh = wrapX(-off * 0.25, 80);
  for (let r = 0; r < 6; r++) {
    for (let c = -1; c < 14; c++) {
      const x = c * 80 + sh + (r % 2) * 40, y = 30 + r * 60;
      for (let p = 0; p < 4; p++) circle(x + Math.cos(p * Math.PI / 2) * 5, y + Math.sin(p * Math.PI / 2) * 5, 4.5, '#e4aaa0');
      circle(x, y, 3, '#f5d06a');
    }
  }
  ctx.fillStyle = '#8a5a3c'; ctx.fillRect(0, 340, W, 10);
  // dantel perdeli pencere
  for (let i = 0; i < 2; i++) {
    const x = wrapX(i * 640 - off * 0.25, 1280) - 200;
    rrect(x - 6, 54, 162, 142, 6, '#7a4e33');
    ctx.fillStyle = '#bfe6f7'; ctx.fillRect(x, 60, 150, 130);
    ctx.fillStyle = 'rgba(255,255,255,0.88)'; ctx.fillRect(x, 60, 150, 70);
    for (let k = 0; k < 10; k++) circle(x + 7.5 + k * 15, 130, 7.5, 'rgba(255,255,255,0.88)');
  }
  // sarkaçlı duvar saati
  {
    const x = wrapX(380 - off * 0.25, 1280) - 200;
    const sw = Math.sin(t * 0.06) * 0.35;
    rrect(x - 34, 50, 68, 170, 10, '#6a3d22');
    circle(x, 92, 26, '#fff8e6'); ring(x, 92, 26, '#c9a24a', 3);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, 92); ctx.lineTo(x + 12, 82); ctx.moveTo(x, 92); ctx.lineTo(x - 4, 74); ctx.stroke();
    ctx.strokeStyle = '#c9a24a'; ctx.beginPath(); ctx.moveTo(x, 125); ctx.lineTo(x + Math.sin(sw) * 60, 125 + Math.cos(sw) * 60); ctx.stroke();
    circle(x + Math.sin(sw) * 60, 125 + Math.cos(sw) * 60, 11, '#e0b84e');
  }
  for (let i = 0; i < 4; i++) plant(wrapX(i * 320 + 100 - off * 0.5, 1280) - 160, true);
  woodFloor(off);
  // kilim
  ctx.fillStyle = '#a8322d'; ctx.fillRect(0, 478, W, 52);
  ctx.fillStyle = '#e8c35a'; ctx.fillRect(0, 482, W, 4); ctx.fillRect(0, 522, W, 4);
  for (let i = 0; i < 14; i++) {
    const x = wrapX(i * 80 - off, 1120) - 80;
    poly([[x, 504], [x + 18, 490], [x + 36, 504], [x + 18, 518]], '#24426e');
    poly([[x + 10, 504], [x + 18, 497], [x + 26, 504], [x + 18, 511]], '#e8c35a');
  }
}

function drawLevelBg(lv, off, t) { (lv.theme === 'anane' ? drawAnane : drawHome)(off, t); }

// ================================================================ karakterler + eşyalar
function drawDeniz(x, y, t, blink, shield) {
  if (shield > 0 && !(shield < 60 && Math.floor(t / 5) % 2)) {
    ctx.fillStyle = 'rgba(255, 220, 120, 0.25)'; ctx.beginPath(); ctx.arc(x, y - 4, 58, 0, Math.PI * 2); ctx.fill();
    ring(x, y - 4, 58, 'rgba(255, 200, 60, 0.9)', 4);
  }
  if (blink && Math.floor(t / 4) % 2 === 0) return;
  const w = Math.sin(t * 0.5) * 10;
  ell(x - 47, y - 11 - w, 18, 11, C.white);
  ell(x + 47, y - 11 - w, 18, 11, C.white);
  ctx.strokeStyle = '#19191e'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.ellipse(x, y - 18, 44, 40, 0, Math.PI + 0.1, Math.PI * 2 - 0.1); ctx.stroke();
  ell(x, y + 1, 40, 35, '#28282e');
  ell(x, y + 2, 32, 28, '#3e3e46');
  ell(x, y + 11, 20, 17, C.onesie);
  circle(x - 10, y + 26, 7, C.white);
  circle(x + 10, y + 26, 7, C.white);
  face(IMG.deniz, x, y - 16, 22);
}

function drawPerson(x, y, t, o) {
  const s = o.s || 1;
  if (o.monster) {
    const f = Math.sin(t * 0.3) * 10 * s;
    for (const side of [-1, 1]) {
      poly([[x + side * 20 * s, y + 10 * s], [x + side * 66 * s, y - 14 * s - f],
            [x + side * 56 * s, y + 18 * s], [x + side * 40 * s, y + 6 * s]], C.wing);
    }
  }
  if (o.hair === 'curly') {
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * Math.PI * 2;
      circle(x + Math.cos(a) * 28 * s, y - 14 * s + Math.sin(a) * 28 * s, 12 * s, C.hairB);
    }
    for (let j = 0; j < 5; j++) for (const side of [-1, 1]) circle(x + side * (30 + j * 2) * s, y + j * 12 * s, 12 * s, C.hairB);
  } else if (o.hair === 'long') {
    ell(x, y - 4 * s, 31 * s, 36 * s, C.hairD);
  }
  ell(x, y + 27 * s, 28 * s, 23 * s, o.shirt);
  if (o.patch) {
    ctx.fillStyle = '#ebebeb'; ctx.fillRect(x - 20 * s, y + 18 * s, 14 * s, 16 * s);
    ctx.fillStyle = C.orange; ctx.fillRect(x - 18 * s, y + 26 * s, 10 * s, 6 * s);
  }
  face(o.img, x, y - 14 * s, 26 * s);
  if (o.crown) {
    poly([[x - 22 * s, y - 36 * s], [x - 22 * s, y - 58 * s], [x - 11 * s, y - 47 * s], [x, y - 64 * s],
          [x + 11 * s, y - 47 * s], [x + 22 * s, y - 58 * s], [x + 22 * s, y - 36 * s]], C.yellow);
  } else if (o.monster) {
    for (const side of [-1, 1]) {
      poly([[x + side * 20 * s, y - 32 * s], [x + side * 15 * s, y - 54 * s], [x + side * 6 * s, y - 37 * s]], C.red);
    }
  }
  if (o.name) text(o.name, 20, C.white, x, y - 68 * s);
}

function drawEmzik(x, y, t) {
  y += Math.sin(t * 0.1) * 4;
  ring(x, y - 17, 8, '#ffc850', 3);
  circle(x, y, 13, '#5aaaf0');
  ring(x, y, 13, C.white, 2);
  circle(x, y + 13, 6, '#fae1be');
}

function drawCookie(x, y, t) {
  y += Math.sin(t * 0.12) * 5;
  ctx.fillStyle = 'rgba(255, 215, 80, 0.35)'; ctx.beginPath(); ctx.arc(x, y, 24, 0, Math.PI * 2); ctx.fill();
  circle(x, y, 16, '#d99a4e');
  ring(x, y, 16, '#a86a2c', 2);
  for (const [dx, dy] of [[-6, -5], [5, -7], [7, 4], [-3, 7], [0, 0]]) circle(x + dx, y + dy, 2.6, '#5a3216');
}

function drawSlipper(x, y, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ell(0, 0, 26, 11, '#3b6fb5');
  ell(0, 0, 21, 7, '#9cc3ef');
  ctx.fillStyle = '#e04a6a'; ctx.beginPath(); ctx.ellipse(8, -4, 12, 9, 0, Math.PI, Math.PI * 2); ctx.fill();
  circle(8, -12, 4, C.white);
  ctx.restore();
}

function drawBottle(x, y) {
  ell(x, y - 25, 6, 7, '#f0aa5a');
  rrect(x - 11, y - 21, 22, 8, 2, '#5aaaf0');
  rrect(x - 10, y - 14, 20, 36, 5, C.white);
  rrect(x - 8, y, 16, 20, 3, '#faf5dc');
  ctx.strokeStyle = '#a0bedc'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x - 10, y - 14, 20, 36, 5); ctx.stroke();
}

function drawDilan(x, y, t) {
  const s = 1.3;
  drawPerson(x, y, t, { shirt: C.maroon, img: IMG.dilan, name: 'Dilan Anne', s, hair: 'long' });
  const bx = x - 50 * s, by = y - 30 * s + Math.sin(t * 0.08) * 5;
  ctx.strokeStyle = C.maroon; ctx.lineWidth = 12; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - 20 * s, y + 14 * s); ctx.lineTo(bx + 6, by + 14); ctx.stroke();
  ctx.lineCap = 'butt';
  drawBottle(bx, by);
  heart(x + 52, y - 92 + Math.sin(t * 0.1) * 6, 10, C.pink);
}

const SEZGIN = { shirt: C.orange, name: 'Sezgin Amca', monster: true };

const CANSU = { shirt: '#4b3a30', hair: 'curly', crown: true, monster: true };

// harita evleri
function drawHouse(x, y, kind, locked) {
  if (kind === 3) {
    const col = locked ? '#b9b4b0' : '#eeeae2';
    ell(x, y + 40, 70, 10, 'rgba(0,0,0,0.15)');
    ctx.fillStyle = col; ctx.fillRect(x - 8, y - 70, 16, 110);
    ctx.fillStyle = locked ? '#8f8a86' : '#c9c2b5'; ctx.fillRect(x - 1.5, y - 124, 3, 26);
    circle(x, y - 84, 19, locked ? '#9a9591' : '#7fb3d5');
    ell(x, y - 70, 24, 6, col);
    if (!locked) {
      drawStroller(x + 46, y + 20, 'deniz2', 0.45);
      for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) { ctx.fillStyle = (r + c) % 2 ? '#111' : C.white; ctx.fillRect(x - 70 + c * 7, y - 6 + r * 7, 7, 7); }
      ctx.fillStyle = '#555'; ctx.fillRect(x - 72, y - 6, 2, 46);
    } else {
      rrect(x - 16, y - 10, 32, 26, 5, '#4a4542');
      ring(x, y - 12, 10, '#4a4542', 5);
    }
    return;
  }
  const wall = locked ? '#c9c4c0' : kind === 2 ? '#fff1e0' : '#f6d6a8';
  const roof = locked ? '#8f8a86' : kind === 2 ? '#8b4a2b' : '#d9534f';
  if (kind === 2 && !locked) {
    rrect(x + 30, y - 78, 16, 36, 2, '#7a3d22');
    for (let i = 0; i < 3; i++) circle(x + 40 + i * 8, y - 88 - i * 14 + Math.sin(G.t * 0.05 + i) * 3, 7 + i * 2, 'rgba(255,255,255,0.8)');
  }
  rrect(x - 55, y - 40, 110, 80, 6, wall);
  poly([[x - 70, y - 36], [x, y - 92], [x + 70, y - 36]], roof);
  rrect(x - 14, y, 28, 40, 4, locked ? '#7c7672' : '#8a5a3c');
  rrect(x - 44, y - 22, 24, 22, 3, locked ? '#a9a39f' : '#bfe6f7');
  rrect(x + 20, y - 22, 24, 22, 3, locked ? '#a9a39f' : '#bfe6f7');
  if (kind === 2 && !locked) for (let i = 0; i < 5; i++) circle(x - 50 + i * 25, y + 40, 7, '#e0414f');
  if (locked) {
    rrect(x - 16, y - 20, 32, 26, 5, '#4a4542');
    ring(x, y - 22, 10, '#4a4542', 5);
  }
}

// ================================================================ nesneler
class Enemy {
  constructor(kind, prog, lv) {
    this.kind = kind;
    this.x = W + 80;
    this.base = 90 + Math.random() * 300;
    this.y = this.base;
    this.t = Math.random() * 6.28;
    this.vx = (kind === 'sezgin' ? 3.5 + 2 * prog : 4.5 + 2.5 * prog) * lv.enemyMul;
    this.homing = lv.homing;
    this.r = 32;
  }
  update(by) {
    this.x -= this.vx; this.t += 0.06;
    if (this.kind === 'sezgin') this.y = this.base + Math.sin(this.t) * 70;
    else this.y += (by - this.y) * this.homing;
  }
  draw(t) {
    const o = this.kind === 'sezgin' ? SEZGIN : NAZIM;
    o.img = IMG[this.kind];
    drawPerson(this.x, this.y, t, o);
  }
}

class Boss {
  constructor(lv) {
    this.lv = lv;
    this.x = W + 150; this.y = H / 2;
    this.hp = this.max = lv.bossHp;
    this.t = 0; this.cool = 90; this.flash = 0; this.shots = 0;
    this.quote = lv.lines[0]; this.quoteT = 200; this.qi = 0;
  }
  get ready() { return this.x <= W - 160; }
  say(q) { this.quote = q; this.quoteT = 170; }
  update() {
    this.t += 0.02;
    if (this.x > W - 160) this.x -= 2;
    this.y = 250 + Math.sin(this.t * this.lv.bossSpeed) * 140;
    this.cool--; if (this.flash > 0) this.flash--; if (this.quoteT > 0 && this.ready) this.quoteT--;
    const steps = [0.8, 0.6, 0.4, 0.2];
    while (this.qi < 4 && this.hp / this.max <= steps[this.qi]) { this.qi++; this.say(this.lv.lines[this.qi]); }
  }
  draw(t) {
    drawPerson(this.x, this.y, t, Object.assign({ img: IMG.cansu, s: 2 }, CANSU));
    if (this.flash) ring(this.x, this.y, 88, C.white, 5);
  }
  drawQuote() { if (this.quoteT > 0 && this.ready) speech(this.quote, this.x - 40, this.y - 20); }
}

function bubbleAbove(txt, ax, ay) {
  ctx.font = `700 18px ${FONT}`;
  const w = ctx.measureText(txt).width + 26, h = 36;
  const bx = Math.max(8, Math.min(W - w - 8, ax - w / 2));

function wheel(x, y, r) {

const BED_SOUNDS = 7;                  // yatırırken çıkan ses sayısı
const REACT_MIN = 275, REACT_MAX = 275;  // tepki süresi (ms)
function fart() {                 // kuvvetli osuruk sesi
  const t0 = AC.currentTime, dur = 0.8;
  const o = AC.createOscillator(); o.type = 'sawtooth';
  for (let i = 0; i < dur / 0.03; i++) o.frequency.setValueAtTime(68 + Math.random() * 50 - i * 0.5, t0 + i * 0.03);
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 450; f.Q.value = 7;
  const flut = AC.createGain(); flut.gain.value = 0.6;
  const lfo = AC.createOscillator(); lfo.type = 'square';
  lfo.frequency.setValueAtTime(24, t0); lfo.frequency.linearRampToValueAtTime(13, t0 + dur);
  const lg = AC.createGain(); lg.gain.value = 0.4; lfo.connect(lg); lg.connect(flut.gain);
  const env = AC.createGain();
  env.gain.setValueAtTime(0.0001, t0); env.gain.linearRampToValueAtTime(0.55, t0 + 0.03);
  env.gain.setValueAtTime(0.5, t0 + dur - 0.2); env.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  const nb = AC.createBuffer(1, Math.floor(AC.sampleRate * dur), AC.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const ns = AC.createBufferSource(); ns.buffer = nb;
  const nf = AC.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 160; nf.Q.value = 1.2;
  const ng = AC.createGain(); ng.gain.value = 0.7;
  o.connect(f); f.connect(flut); ns.connect(nf); nf.connect(ng); ng.connect(flut);
  flut.connect(env); env.connect(AC.destination);
  o.start(t0); lfo.start(t0); ns.start(t0);
  o.stop(t0 + dur); lfo.stop(t0 + dur); ns.stop(t0 + dur);
}
function sfx(kind) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime;
    if (kind === 'bed') {            // yatak gıcırtısı
      for (let i = 0; i < 3; i++) {
        const o = AC.createOscillator(), g = AC.createGain(), st = t0 + i * 0.12;
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(520, st); o.frequency.linearRampToValueAtTime(840, st + 0.06); o.frequency.linearRampToValueAtTime(600, st + 0.1);
        g.gain.setValueAtTime(0.0001, st); g.gain.linearRampToValueAtTime(0.07, st + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.11);
        o.connect(g); g.connect(AC.destination); o.start(st); o.stop(st + 0.12);
      }
    } else {
      const o = AC.createOscillator(), g = AC.createGain(), lfo = AC.createOscillator(), lg = AC.createGain();
      lfo.connect(lg); lg.connect(o.frequency);
      let end;
      if (kind === 'door') {         // kapı gıcırtısı
        end = 0.8; o.type = 'sawtooth';
        o.frequency.setValueAtTime(170, t0); o.frequency.linearRampToValueAtTime(540, t0 + 0.7);
        lfo.frequency.value = 26; lg.gain.value = 45;
        g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.06, t0 + 0.05); g.gain.linearRampToValueAtTime(0.05, t0 + 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.75);
        o.connect(g);
      } else {                       // ufak pırt
        end = 0.32; o.type = 'square';
        o.frequency.setValueAtTime(115, t0); o.frequency.exponentialRampToValueAtTime(55, t0 + 0.28);
        lfo.frequency.value = 34; lg.gain.value = 25;
        const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 650;
        g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.2, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
        o.connect(f); f.connect(g);
      }
      g.connect(AC.destination);
      o.start(t0); lfo.start(t0); o.stop(t0 + end); lfo.stop(t0 + end);
    }
  } catch (e) {}
}

class Race {
  constructor(lv) {
    Object.assign(this, {
      lv, lane: 1, y: LANES[1], x: 280, zoomE: 0, sleep: 0, off: 0, speed: 6,
      pillows: [], items: [], notes: [], signs: [], smoke: [], signI: 0, pond: null,
      itemT: 60, sez: null, sezLast: '', mode: 'race', bed: null, wakes: 0,
      sezAt: [0.12 + Math.random() * 0.33, 0.55 + Math.random() * 0.33].map(p => Math.floor(p * lv.len)),
      turbo: 0, inv: 0, shield: 0, happy: 0, finish: null,
      dilan: null, nazim: null, nazT: 120, cansu: null, bub: null
    });
  }
  move(d) {
    const n = Math.max(0, Math.min(LANES.length - 1, this.lane + d));
    if (n !== this.lane) { this.lane = n; beep(480 + n * 70, 0.06, 'triangle', 0.04); }
  }
  talk(txt, who, d = 160) { this.bub = { txt, who, t: d }; }
  safe() { return this.inv > 0 || this.turbo > 0 || this.shield > 0; }
  addSleep(v) {
    if (this.mode === 'bed' || this.safe()) return false;
    this.sleep = Math.min(100, this.sleep + v);
    this.inv = 60;
    G.burst(this.x, this.y - 20, '#9b8cff', 14);
    G.quake(v >= 40 ? 18 : v >= 25 ? 13 : 8);
    G.pop(this.x, this.y - 100, '+' + v + ' uyku', '#c3b5ff', v >= 40 ? 30 : 24);
    beep(180, 0.25, 'square', 0.05);
    if (this.sleep >= 100) this.startBed();
    return true;
  }
  nearestLane(y) { let ln = 0; for (let i = 1; i < LANES.length; i++) if (Math.abs(LANES[i] - y) < Math.abs(LANES[ln] - y)) ln = i; return ln; }

  update() {
    this.zoomE += ((this.turbo > 0 && this.mode !== 'bed' ? 1 : 0) - this.zoomE) * 0.08;
    if (this.mode === 'bed') { this.bedUpdate(); return; }
    const g = G, lv = this.lv;
    const prog = Math.min(1, g.frame / lv.len);
    const speed = 6 + 3.5 * prog + (this.turbo > 0 ? 4 : 0);
    this.speed = speed; this.off += speed; g.scroll = this.off;
    for (const k of ['turbo', 'inv', 'shield', 'happy']) if (this[k] > 0) this[k]--;
    if (this.bub && --this.bub.t <= 0) this.bub = null;
    this.y += (LANES[this.lane] - this.y) * 0.25;

    if (!this.finish) {
      g.frame++;
      this.sleep = Math.min(100, this.sleep + 0.016);
      if (this.sleep >= 100) { this.startBed(); return; }
    }

    const SIGNS = [[0.01, 'Kızılay'], [0.18, 'Tunalı Hilmi'], [0.34, 'Kuğulu Park'], [0.52, 'Anıtkabir'], [0.7, 'Çankaya'], [0.9, 'Atakule 1 km']];
    if (this.signI < SIGNS.length && prog >= SIGNS[this.signI][0]) {
      this.signs.push({ x: W + 80, txt: SIGNS[this.signI][1] });
      if (SIGNS[this.signI][1] === 'Kuğulu Park') this.pond = { x: W + 260 };
      this.signI++;
    }
    for (const s of this.signs) s.x -= speed;
    this.signs = this.signs.filter(s => s.x > -120);
    if (this.pond) { this.pond.x -= speed * 0.45; if (this.pond.x < -200) this.pond = null; }

    const active = !this.finish;
    if (active) {
      if (--this.itemT <= 0) {
        const ln = Math.floor(Math.random() * LANES.length);
        const kind = Math.random() < 0.2 ? 'p' : 'e';
        this.items.push({ x: W + 40, y: LANES[ln], kind });
        g.potential += kind === 'p' ? 5 : 10;
        this.itemT = 80 + Math.floor(Math.random() * 60);
      }
      if (!this.sez && this.sezAt.length && g.frame >= this.sezAt[0]) {
        this.sezAt.shift();
        let line; do { line = pick(SEZ_LINES); } while (line === this.sezLast);
        this.sezLast = line;
        this.sez = { x: W + 90, y: 150, t: 0, gave: false, beam: 0 };
        this.talk(line, 'sez', 200);
      }
    }

    // Sezgin Amca: kalkan verir
    if (this.sez) {
      const z = this.sez; z.t++;
      if (z.t < 170) { z.x += (620 - z.x) * 0.05; z.y = 150 + Math.sin(z.t * 0.08) * 10; }
      else { z.x += 7; z.y -= 3; }
      if (!z.gave && z.t === 100) {
        z.gave = true; z.beam = 24;
        this.shield = 330;
        g.slowmo(45); g.pop(this.x, this.y - 110, 'Kalkan!', '#ffd73c', 30);
        g.say('Sezgin Amca’dan koruma kalkanı!', 110);
        tune([660, 880, 1100], 80);
      }
      if (z.beam > 0) z.beam--;
      if (z.x > W + 120) this.sez = null;
    }

    // ---- Dilan Anne: arkadan ninni
    const wantD = active;   // Dilan Anne hiç kaybolmaz
    if (wantD && !this.dilan) { this.dilan = { x: -200, y: this.y, tx: 70, noteT: 90 }; this.talk(pick(CH.dilan), 'dilan'); }
    if (this.dilan) {
      const d = this.dilan;
      d.tx = wantD ? Math.min(150, d.tx + 0.035) : -260;
      if (this.turbo > 0 && wantD) d.tx = Math.max(20, d.tx - 2);
      d.x += (d.tx - d.x) * 0.03;
      d.y += (this.y - d.y) * 0.02;
      if (wantD && d.x > 0 && --d.noteT <= 0) {
        this.notes.push({ x: d.x + 80, y: LANES[this.nearestLane(d.y)] - 8, t: 0 });
        d.noteT = prog > 0.75 ? 60 : 85;
        if (Math.random() < 0.3) this.talk(pick(CH.dilan), 'dilan', 110);
      }
      if (Math.abs(d.y - this.y) < 35 && d.x + 78 > this.x - 70 && this.addSleep(25)) {
        d.tx = 20; this.talk('Yakaladım seni! Hadi uykuya…', 'dilan', 120);
      }
      if (!wantD && d.x < -200) this.dilan = null;
    }

    // ---- Nazım Baba: şerit değiştire değiştire hızla gelip geçer
    const wantN = active && prog > 0.08;
    if (wantN && !this.nazim && --this.nazT <= 0) {
      const ln = Math.floor(Math.random() * LANES.length);
      this.nazim = { x: -220, y: LANES[ln], lane: ln, rot: 0, laneT: 20, vx: 8.5 + 4 * prog, hit: false, warn: 50 };
      if (Math.random() < 0.5) this.talk(pick(CH.nazim), 'nazim', 90);
      beep(240, 0.3, 'sawtooth', 0.04);
    }
    if (this.nazim) {
      const n = this.nazim;
      if (n.warn > 0) n.warn--; else n.x += n.vx;
      if (--n.laneT <= 0) {
        let d;
        if (n.x < this.x && Math.random() < 0.65) d = Math.sign(this.lane - n.lane) || (Math.random() < 0.5 ? -1 : 1);
        else d = Math.random() < 0.5 ? -1 : 1;
        if (n.lane + d < 0 || n.lane + d >= LANES.length) d = -d;
        n.lane += d;
        n.laneT = 20 + Math.floor(Math.random() * 16);
        beep(900, 0.1, 'sawtooth', 0.02);
      }
      const prevY = n.y;
      n.y += (LANES[n.lane] - n.y) * 0.13;
      const lat = n.y - prevY;
      n.rot = lat * 0.06 + Math.sin(g.t * 0.25) * 0.07;
      if (Math.abs(lat) > 0.8 || g.t % 4 === 0) this.smoke.push({ x: n.x - 70, y: n.y + 22, r: 6, life: 30 });
      if (!n.hit && Math.abs(n.y - this.y) < 38 && Math.abs(n.x - this.x) < 110) {
        n.hit = true;
        if (this.addSleep(40)) this.talk('Yakalandın! Pijama vakti!', 'nazim', 100);
        else if (this.shield > 0 || this.turbo > 0) { g.burst(this.x + 40, this.y, '#ffd73c', 14); beep(260, 0.15, 'square', 0.04); g.quake(8); g.slowmo(24); g.pop(this.x, this.y - 100, 'Sekti!', '#ffd73c', 26); }
      }
      if (n.x > W + 250) { this.nazim = null; this.nazT = (prog > 0.7 ? 150 : 230) + Math.floor(Math.random() * 100); }
    }
    for (const sm of this.smoke) { sm.x -= speed * 0.6; sm.r += 0.6; sm.life--; }
    this.smoke = this.smoke.filter(sm => sm.life > 0);

    // ---- Cansu Hala: önden yastık atar
    const wantC = active && prog > 0.45;
    if (wantC && !this.cansu) { this.cansu = { x: W + 220, y: LANES[0], dropT: 90 }; this.talk(pick(CH.cansu), 'cansu'); }
    if (this.cansu) {
      const c = this.cansu;
      c.x += ((wantC ? 760 : W + 300) - c.x) * 0.03;
      c.y += (this.y - c.y) * 0.015;
      if (wantC && c.x < W - 120 && --c.dropT <= 0) {
        this.pillows.push({ x: c.x - 90, y: LANES[this.nearestLane(c.y)] });
        g.potential += 1;
        c.dropT = prog > 0.75 ? 70 : 100;
        if (Math.random() < 0.25) this.talk(pick(CH.cansu), 'cansu', 110);
      }
      if (!wantC && c.x > W + 240) this.cansu = null;
    }

    if (g.frame >= lv.len && !this.finish) {
      this.finish = { x: W + 500 };
      g.potential += 100;
      g.say('Atakule göründü! Bitiş çizgisine bas gaza!', 200);
    }

    for (const p of this.pillows) {
      p.x -= speed;
      if (Math.abs(p.x - this.x) < 80 && Math.abs(p.y - this.y) < 35) {
        if (this.turbo > 0 || this.shield > 0) { g.score += 2; g.burst(p.x, p.y, '#cfe2f8', 12); g.pop(p.x, p.y - 30, '+2', C.white, 20); p.x = -999; beep(300, 0.1, 'square', 0.04); }
        else if (this.addSleep(15)) p.x = -999;
      }
      if (p.x < -60 && p.x > -900) { g.score += 1; p.x = -999; }
    }
    this.pillows = this.pillows.filter(p => p.x > -900);

    for (const it of this.items) {
      it.x -= speed;
      if (Math.abs(it.x - this.x) < 62 && Math.abs(it.y - this.y) < 38) {
        if (it.kind === 'e') {
          g.score += 10; g.pac++;
          beep(880, 0.1, 'sine', 0.05);
          g.pop(it.x, it.y - 30, '+10');
          if (g.pac % 5 === 0) {
            this.sleep = Math.max(0, this.sleep - 30); this.happy = 90;
            g.pop(this.x, this.y - 120, 'Uyku -30!', '#9be07a', 30);
            g.say('5 emzik topladın: uyku -30!', 110);
            setTimeout(() => tune([784, 988, 1175], 90), 120);
          }
        } else {
          g.score += 5; this.turbo = 180; this.happy = 180;
          g.pop(it.x, it.y - 30, '+5 Turbo!', '#ff9a3c', 26);
          g.say('Şeftali: turbo!', 100);
          tune([523, 784], 90);
        }
        g.burst(it.x, it.y, C.yellow, 10);
        it.x = -999;
      }
    }
    this.items = this.items.filter(it => it.x > -50);

    for (const nt of this.notes) {
      nt.x += 4.5; nt.t++;
      if (Math.abs(nt.x - this.x) < 48 && Math.abs(nt.y + 8 - this.y) < 34) {
        if (this.addSleep(10)) nt.x = W + 999;
        else if (this.shield > 0) { g.burst(nt.x, nt.y, '#b9a8ff', 8); nt.x = W + 999; }
      }
    }
    this.notes = this.notes.filter(nt => nt.x < W + 30);

    if (this.finish) {
      this.finish.x -= speed;
      if (this.finish.x <= this.x) {
        g.score += 100; this.happy = 9999;
        g.burst(this.x, this.y, C.yellow, 50);
        g.win();
      }
    }
  }

  // ============================================================ UYKU SAHNESİ
  startBed() {
    if (this.mode === 'bed') return;
    this.mode = 'bed';
    const lines = this.narrated ? ['Yine mi uyudu! Hadi, kulak kesil!'] : [
      'Eyvah, Deniz uyuyakaldı! Nazım Baba onu yatağa götürüyor…',
      'Ama dikkat: yatak gıcırdarsa, kapı gıcırdarsa ya da babası pırt yaparsa…',
      '…sesi duyar duymaz ekrana dokun! 3 kere yakalarsan Deniz uyanır!'
    ];
    this.narrated = true;
    this.bed = { lines, li: 0, lt: 0, t: 0, phase: 'intro', hits: 0, errors: 0, soundsLeft: BED_SOUNDS, next: 0, cur: null, nx: -140, flash: 0, errFlash: 0 };
    this.notes = []; this.pillows = []; this.nazim = null; this.bub = null;
    Music.play('lullaby');
  }
  bedTap() {
    const b = this.bed;
    if (b && b.phase === 'intro') { if (b.lt > 20) { b.li++; b.lt = 0; beep(600, 0.06, 'triangle', 0.03); } return; }
    if (!b || b.phase !== 'listen') return;
    const now = performance.now();
    if (b.cur && !b.cur.done && now - b.cur.at <= b.cur.win) {
      b.cur.done = true; b.hits++; b.flash = 30;
      beep(1046, 0.12, 'triangle', 0.06);
    } else {
      if (b.cur) b.cur.done = true;
      b.errors++; b.errFlash = 40;
      beep(150, 0.2, 'square', 0.04);
    }
  }
  bedUpdate() {
    const b = this.bed, g = G;
    b.t++;
    if (b.flash > 0) b.flash--;
    if (b.errFlash > 0) b.errFlash--;
    if (b.phase === 'intro') {
      b.lt++;
      if (b.lt > 200) { b.li++; b.lt = 0; }
      if (b.li >= b.lines.length) { b.phase = 'carry'; b.t = 0; }
      return;
    }
    if (b.phase === 'carry') {
      b.nx = -140 + Math.min(1, b.t / 150) * 600;
      if (b.t > 160) { b.phase = 'listen'; b.t = 0; b.next = 70; b.nx = 660; }
      return;
    }
    if (b.phase === 'listen') {
      b.nx = Math.min(740, b.nx + 0.55);
      if (b.cur && b.t - b.cur.frame > 45) b.cur = null;
      if (!b.cur && --b.next <= 0) {
        if (b.soundsLeft <= 0) { b.phase = 'fail'; b.t = 0; return; }
        const kind = pick(['bed', 'door', 'pirt']);
        sfx(kind);
        b.cur = { kind, at: performance.now(), win: REACT_MIN + Math.random() * (REACT_MAX - REACT_MIN), frame: b.t, done: false };
        b.soundsLeft--;
        b.next = 45 + Math.floor(Math.random() * 80);
      }
      if (b.hits >= 3) { b.phase = 'wake'; b.t = 0; tune([523, 659, 784, 1047], 110); }
      else if (b.errors >= 3) { b.phase = 'fail'; b.t = 0; }
      return;
    }
    if (b.phase === 'wake' && b.t > 110) {
      this.mode = 'race'; this.bed = null;
      Music.play('race');
      this.sleep = 45; this.shield = 150; this.inv = 0; this.wakes = (this.wakes || 0) + 1;
      if (this.dilan) { this.dilan.x = -140; this.dilan.tx = 30; }
      this.nazT = 260;
      g.say('Deniz uyandı! Gaza bas!', 120);
    }
    if (b.phase === 'fail' && b.t > 100) { g.state = 'over'; g.endWait = 50; }
  }
  drawBedroom() {
    const b = this.bed, t = G.t;

    rrect(616 + sh, 300, 26, 120, 6, '#6b4228');

    rrect(344 + sh, 318, 274, 32, 12, '#f4f1e8');

    const inBed = b.phase !== 'carry' && b.phase !== 'intro';
    if (inBed) {

      drawPerson(sx, sy, t, { shirt: '#3d6fa8', img: IMG.sezgin2, name: 'Sezgin Amca', s: 1.5 });
      const line = b.lines[Math.min(b.li, b.lines.length - 1)];
      const shown = line.slice(0, Math.floor(b.lt * 1.4));
      rrect(320, 190, 580, 120, 18, C.white);
      poly([[322, 260], [322, 290], [280, 300]], C.white);
      ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(320, 190, 580, 120, 18); ctx.stroke();
      ctx.font = `700 24px ${FONT}`; ctx.fillStyle = C.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      const words = shown.split(' '); let row = '', ry = 228;
      for (const w of words) {
        if (ctx.measureText(row + w).width > 540) { ctx.fillText(row, 340, ry); row = ''; ry += 34; }
        row += w + ' ';
      }
      ctx.fillText(row, 340, ry);
      return;
    }
    // Nazım Baba
    const bob = Math.abs(Math.sin(t * (b.phase === 'carry' ? 0.18 : 0.08))) * 6;

    drawPerson(b.nx, ny, t, { shirt: C.black, img: IMG.nazim2, patch: true, name: 'Nazım Baba', s: 1.4 });
    if (b.phase === 'carry') {

    if (b.phase === 'listen' && b.t < 90) bubbleAbove('Şşşt… Sessizce çıkayım…', b.nx, ny - 92);
    if (b.phase === 'wake') bubbleAbove('Aaa! Uyandı!', b.nx, ny - 92);

      const k = cur.kind, a = 1 - (b.t - cur.frame) / 45;
      ctx.globalAlpha = Math.max(0, a);
      if (k === 'bed') text('GIIIC!', 46, C.yellow, 480 + sh, 230);
      else if (k === 'door') text('GICIRRR!', 44, C.yellow, 780, 140);
      else {
        for (let i = 0; i < 6; i++) circle(b.nx - 46 - i * 14, ny + 34 - i * 9, 12 + i * 6, 'rgba(150,220,110,0.45)');

  drawSpeed() {

    if (who === 'nazim' && this.nazim && this.nazim.x > 60 && this.nazim.x < W - 60) return [this.nazim.x, this.nazim.y - 108];

  draw() {

    const g = G, t = g.t, off = this.off, prog = Math.min(1, g.frame / this.lv.len);

    ctx.fillStyle = '#4b4b55'; ctx.fillRect(0, ROAD_TOP, W, ROAD_BOT - ROAD_TOP);

    list.push([this.y + 0.1, () => {
      if (this.inv > 0 && Math.floor(t / 4) % 2 === 0) return;
      if (this.turbo > 0) {
        const fl = 22 + Math.random() * 16, ex = this.x - 66, ey = this.y + 12;
        poly([[ex, ey - 8], [ex - fl, ey], [ex, ey + 8]], '#ff9a3c');
        poly([[ex, ey - 4], [ex - fl * 0.6, ey], [ex, ey + 4]], C.yellow);
      }
      drawStroller(this.x, this.y, this.happy > 0 ? 'deniz3' : 'deniz2', CS);
      if (this.shield > 0 && !(this.shield < 70 && Math.floor(t / 5) % 2)) {
        ctx.fillStyle = 'rgba(255, 220, 120, 0.22)'; ctx.beginPath(); ctx.arc(this.x, this.y - 10, 82, 0, Math.PI * 2); ctx.fill();
        ring(this.x, this.y - 10, 82, 'rgba(255, 200, 60, 0.95)', 4);
      }
    }]);
    list.sort((a, b) => a[0] - b[0]);
    for (const d of list) d[1]();
    for (const nt of this.notes) drawNote(nt.x, nt.y + Math.sin(nt.t * 0.2) * 6);
    if (dusk > 0) { ctx.fillStyle = `rgba(30,15,60,${0.14 * dusk})`; ctx.fillRect(0, ROAD_TOP, W, H - ROAD_TOP); }
    if (this.nazim && this.nazim.x < -60) {
      const ny = this.nazim.y;
      if (Math.floor(t / 5) % 2) { ctx.fillStyle = 'rgba(255,60,60,0.22)'; ctx.fillRect(0, ny - 34, 140, 68); }
      text('!', 54, C.red, 30, ny);
      text('Nazım Baba', 16, C.white, 100, ny);
    }

    if (this.sleep > 50) for (let k = 0; k < 3; k++) {
      const yy = ((t * 0.6 + k * 12) % 36);
      text('z', 18 + k * 6, '#cfc8ff', this.x + 40 + k * 16, this.y - 70 - k * 14 - yy);
    }
    if (this.turbo > 0) text('TURBO!', 26, '#ff9a3c', this.x, this.y - 100);
    else if (this.shield > 0) text('KALKAN', 22, '#ffd73c', this.x, this.y - 100);

    if (this.sez) {
      const z = this.sez;
      if (z.beam > 0) {
        ctx.strokeStyle = `rgba(255,215,60,${z.beam / 24})`; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(z.x, z.y + 20); ctx.lineTo(this.x, this.y - 20); ctx.stroke();
      }
      poly([[z.x - 10, z.y + 6], [z.x - 64, z.y + 34 + Math.sin(t * 0.3) * 6], [z.x - 54, z.y + 52], [z.x + 4, z.y + 34]], C.red);
      drawPerson(z.x, z.y, t, { shirt: '#3d6fa8', img: IMG.sezgin2, name: 'Sezgin Amca' });
    }
    if (this.bub) {
      if (this.bub.who === 'sez') { if (this.sez) speech(this.bub.txt, this.sez.x - 30, this.sez.y - 20); }
      else { const a = this.anchor(this.bub.who); if (a) bubbleAbove(this.bub.txt, a[0], a[1]); }
    }

    if (this.sleep > 60) { ctx.fillStyle = `rgba(25,12,70,${(this.sleep - 60) / 40 * 0.35})`; ctx.fillRect(0, 0, W, H); }
  }

  drawHud() {
    if (this.mode === 'bed') { this.drawBedHud(); return; }
    const g = G;
    circle(32, 32, 15, '#ffe9a0'); circle(40, 26, 13, '#97cdee');
    rrect(54, 20, 180, 24, 12, '#3c3232');
    if (this.sleep > 2) rrect(54, 20, 180 * this.sleep / 100, 24, 12, this.sleep > 70 ? '#5b3fd1' : '#9b8cff');
    text('Uyku', 16, C.white, 144, 33);
    drawEmzik(262, 34, 0);
    text((g.pac % 5) + '/5', 22, C.white, 300, 31);
    const prog = Math.min(1, g.frame / this.lv.len);
    rrect(360, 20, 260, 20, 10, '#3c3232');
    if (prog > 0.03) rrect(360, 20, 260 * prog, 20, 10, C.pink);
    text('Atakule’ye mesafe', 18, C.white, 490, 54);
    text('Puan: ' + g.score, 30, C.yellow, W - 20, 32, 'right');
  }
}

// ================================================================ oyun
const G = {
  state: 'menu', endWait: 0, t: 0, lv: LEVELS[0], buttons: [], mapOff: 0,
  reset() {
    Object.assign(this, {
      bx: 200, by: H / 2, vy: 0, lives: 3, inv: 0, shield: 0, score: 0, frame: 0, scroll: 0,
      enemies: [], items: [], kisses: [], bubbles: [], slippers: [], parts: [],
      spawn: 90, itemSpawn: 150, slipSpawn: 240, fire: 0, boss: null, momX: W + 100,
      msg: '', msgT: 0, slipSaid: false, race: null, pac: 0, potential: 0, stars: 0, banner: 180, starAnim: 0
    });
  },
  say(m, d = 150) { this.msg = m; this.msgT = d; },
  shake: 0, slow: 0, floats: [], btnAge: 0, _ps: null,
  pop(x, y, txt, col = C.yellow, size = 24) { this.floats.push({ x: Math.max(60, Math.min(W - 60, x)), y: Math.max(110, y), txt, col, size, life: 50 }); },
  quake(n) { this.shake = Math.max(this.shake, n); },
  slowmo(n) { this.slow = Math.max(this.slow, n); },
  burst(x, y, col, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, v = 1 + Math.random() * 4;
      this.parts.push([x, y, Math.cos(a) * v, Math.sin(a) * v, 30, col]);
    }
  },
  start(n) {
    this.lv = LEVELS[n - 1];
    this.reset();
    if (this.lv.type === 'race') { this.race = new Race(this.lv); this.state = 'race'; }
    else this.state = 'play';
    this.floats = []; this.shake = 0; this.slow = 0;
    Music.play(this.lv.type === 'race' ? 'race' : this.lv.theme);
    beep(520, 0.15);
  },
  tap(pt) {
    const s = this.state;
    if ((s === 'menu' || s === 'map') && pt && Math.hypot(pt[0] - 40, pt[1] - 500) < 30) { Music.toggle(); return; }
    if (s === 'menu') { if (this.endWait === 0) { this.state = 'map'; beep(600, 0.1); Music.play('menu'); } return; }
    if (s === 'map') {
      if (!pt) return;
      for (const nd of MAP_NODES) {
        if (nd.id > LEVELS.length) continue;
        if (Math.hypot(pt[0] - nd.x, pt[1] - nd.y) < 85) {
          if (isUnlocked(nd.id)) this.start(nd.id);
          else { this.say('Önce önceki bölümü bitir!', 90); beep(180, 0.15, 'square', 0.04); }
        }
      }
      return;
    }
    if (s === 'win' || s === 'over') {
      if (this.endWait > 0) return;
      if (!pt) { s === 'win' ? this.goMap() : this.start(this.lv.id); return; }
      for (const b of this.buttons) if (pt[0] > b.x && pt[0] < b.x + b.w && pt[1] > b.y && pt[1] < b.y + b.h) { b.fn(); return; }
      return;
    }
    if (s === 'race') {
      if (this.race.mode === 'bed') { this.race.bedTap(); return; }
      if (pt) {
        const sy = 320 + (this.race.y - 320) * (this.raceZ || 1);
        if (pt[1] < sy - 8) this.race.move(-1); else if (pt[1] > sy + 8) this.race.move(1);
      }
      return;
    }
    this.vy = -7.5;
    beep(660, 0.08, 'triangle', 0.04);
  },
  goMap() { this.state = 'map'; this.msgT = 0; Music.play('menu'); },
  hurt() {
    if (this.inv > 0 || this.shield > 0) return;
    this.lives--; this.inv = 90;
    this.burst(this.bx, this.by, '#ff5050');
    this.quake(14); this.pop(this.bx, this.by - 50, '-1 can', '#ff6b6b', 26);
    beep(160, 0.25, 'square', 0.05);
    if (this.lives <= 0) { this.state = 'over'; this.endWait = 50; }
  },
  win() {
    const isRace = this.lv.type === 'race';
    const bonus = isRace ? Math.round((100 - this.race.sleep) * 0.75) : this.lives * 25;
    this.bonusLabel = isRace ? 'uyanıklık bonusu' : 'can bonusu';
    this.score += bonus; this.potential += 75;
    const r = this.score / this.potential;
    this.stars = r >= 0.85 ? 3 : r >= 0.7 ? 2 : 1;
    this.need3 = Math.ceil(this.potential * 0.85);
    this.bonus = bonus;
    const id = this.lv.id;
    this.newBest = this.score > (SAVE.best[id] || 0);
    SAVE.stars[id] = Math.max(SAVE.stars[id] || 0, this.stars);
    SAVE.best[id] = Math.max(SAVE.best[id] || 0, this.score);
    persist();
    this.state = 'win'; this.endWait = 70; this.starAnim = 0;
    tune([523, 659, 784, 1047], 160);
  },

  update() {
    this.t++;
    if (this.state !== this._ps) { if (this.state === 'win' || this.state === 'over') Music.stop(); this._ps = this.state; }
    if (this.shake > 0) this.shake--;
    for (const f of this.floats) { f.y -= 1.1; f.life--; }
    this.floats = this.floats.filter(f => f.life > 0);
    if ((this.state === 'win' || this.state === 'over') && this.endWait === 0) this.btnAge++; else this.btnAge = 0;
    if (this.endWait > 0) this.endWait--;
    if (this.msgT > 0) this.msgT--;
    if (this.banner > 0) this.banner--;
    this.starAnim++;
    if (this.state === 'win') for (let i = 0; i < this.stars; i++) if (this.starAnim - 20 - i * 18 === 1) beep(700 + i * 200, 0.2);
    for (const p of this.parts) { p[0] += p[2]; p[1] += p[3]; p[3] += 0.15; p[4]--; }
    this.parts = this.parts.filter(p => p[4] > 0);
    if (!['play', 'boss', 'ending', 'race'].includes(this.state)) { this.scroll += 1; return; }
    if (this.state === 'race') { this.race.update(); return; }

    const lv = this.lv;
    const speed = this.state === 'play' ? lv.speed : 1.5;
    this.scroll += speed;
    this.vy = Math.min(this.vy + 0.38, 9);
    this.by += this.vy;
    if (this.by < 45) { this.by = 45; this.vy = 0; }
    if (this.by > 425) { this.by = 425; this.vy = -5; }
    if (this.inv > 0) this.inv--;
    if (this.shield > 0) this.shield--;

    if (this.state === 'play') {
      this.frame++;
      const prog = Math.min(1, this.frame / lv.len);
      if (this.frame < lv.len) {
        if (--this.spawn <= 0) {
          this.enemies.push(new Enemy(Math.random() < 0.5 ? 'sezgin' : 'nazim', prog, lv));
          this.potential += 1;
          this.spawn = Math.floor(lv.spawnBase - (lv.spawnBase - lv.spawnMin) * prog) + Math.floor(Math.random() * 30);
        }
        if (--this.itemSpawn <= 0) {
          const cookie = lv.cookies && Math.random() < 0.2;
          this.items.push([W + 30, 80 + Math.random() * 320, cookie ? 'k' : 'e']);
          this.potential += cookie ? 5 : 10;
          this.itemSpawn = 120 + Math.floor(Math.random() * 100);
        }
        if (lv.slippers && this.frame > 200 && --this.slipSpawn <= 0) {
          if (this.slippers.length === 0 && !this.slipSaid) { this.say('Ananenin terliği geliyor, dikkat!'); this.slipSaid = true; }
          this.slippers.push({ x: 450 + Math.random() * 550, y: -30, vx: -(2 + Math.random() * 2.5) - speed * 0.4, vy: 1.5 + Math.random() * 2, rot: 0, vr: 0.15 + Math.random() * 0.15 });
          this.slipSpawn = Math.floor(200 - 80 * prog) + Math.floor(Math.random() * 80);
        }
      }
      if (this.frame === Math.floor(lv.len / 2)) this.say('Yarı yoldasın!');
      if (this.frame >= lv.len && this.enemies.length === 0 && this.slippers.length === 0) {
        this.state = 'boss'; this.boss = new Boss(lv); this.items = [];
        Music.play('boss');
        this.potential += lv.bossHp * 2 + 100;
        beep(220, 0.5, 'sawtooth', 0.05);
      }
    }

    for (const e of this.enemies) {
      e.update(this.by);
      if (Math.hypot(e.x - this.bx, e.y - this.by) < e.r + 24) this.hurt();
      if (e.x < -80) this.score += 1;
    }
    this.enemies = this.enemies.filter(e => e.x >= -80);

    for (const sl of this.slippers) {
      sl.x += sl.vx; sl.y += sl.vy; sl.vy += 0.05; sl.rot += sl.vr;
      if (Math.hypot(sl.x - this.bx, sl.y - this.by) < 40) { this.hurt(); sl.y = H + 999; }
    }
    this.slippers = this.slippers.filter(sl => sl.y < H + 40 && sl.x > -60);

    for (const it of this.items) {
      it[0] -= speed;
      if (Math.hypot(it[0] - this.bx, it[1] - this.by) < 40) {
        if (it[2] === 'k') {
          this.score += 5; this.shield = 300;
          this.burst(it[0], it[1], '#e0b84e', 14);
          this.pop(it[0], it[1] - 20, 'Kalkan!', '#ffd73c', 28); this.slowmo(40);
          this.say('Ananenin kurabiyesi: kalkan!', 100);
          tune([660, 880], 90);
        } else {
          this.score += 10; this.pac++;
          this.burst(it[0], it[1], C.yellow, 10);
          this.pop(it[0], it[1] - 20, '+10');
          beep(880, 0.1, 'sine', 0.05);
          if (this.pac % 5 === 0 && this.lives < 3) {
            this.lives++;
            this.say('5 emzik topladın: can +1!', 110);
            this.pop(this.bx, this.by - 60, 'Can +1!', '#ff7aa0', 30);
            setTimeout(() => tune([784, 988, 1175], 90), 120);
          }
        }
        it[0] = -999;
      }
    }
    this.items = this.items.filter(it => it[0] > -50);

    const b = this.boss;
    if (this.state === 'boss') {
      b.update();
      if (b.ready && b.cool <= 0) {
        b.shots++;
        const half = b.hp <= b.max / 2;
        if (lv.ring && b.shots % 3 === 0) {
          for (let i = 0; i < 10; i++) {
            const a = i / 10 * Math.PI * 2;
            this.kisses.push([b.x, b.y, Math.cos(a) * lv.kissSpeed * 0.7, Math.sin(a) * lv.kissSpeed * 0.7]);
          }
        } else {
          const base = Math.atan2(this.by - b.y, this.bx - b.x);
          const angles = half ? [-0.28, 0, 0.28] : [0];
          for (const a of angles) this.kisses.push([b.x - 40, b.y, Math.cos(base + a) * lv.kissSpeed, Math.sin(base + a) * lv.kissSpeed]);
        }
        b.cool = half ? 50 : 75;
        if (lv.ring) b.cool -= 8;
        beep(400, 0.12, 'sine', 0.04);
      }
      if (--this.fire <= 0) { this.bubbles.push([this.bx + 35, this.by - 8]); this.fire = 22; }
      for (const bub of this.bubbles) {
        bub[0] += 9;
        if (b.ready && Math.hypot(bub[0] - b.x, bub[1] - b.y) < 70) {
          b.hp--; b.flash = 6; this.score += 2;
          this.pop(bub[0], bub[1] - 10, '+2', C.white, 18);
          if (b.hp === 0) { this.slowmo(60); this.quake(16); }
          this.burst(bub[0], bub[1], C.white, 6); bub[0] = W + 999;
          beep(300 + b.hp * 10, 0.06, 'triangle', 0.04);
        }
      }
      this.bubbles = this.bubbles.filter(x => x[0] < W + 30);
      if (Math.hypot(b.x - this.bx, b.y - this.by) < 80) this.hurt();
      if (b.hp <= 0) {
        this.state = 'ending'; this.score += 100;
        this.kisses = []; this.bubbles = [];
        this.burst(b.x, b.y, C.pink, 40);
        this.say('Cansu Hala: “' + lv.lines[5] + '”', 240);
        tune([523, 659, 784]);
      }
    }

    if (this.state === 'ending') {
      b.x += 2; b.y += 5;
      if (this.momX > W - 150) this.momX -= 3;
      if (this.bx < this.momX - 120) this.bx += 2.5;
      const bx = this.momX - 65, by = 300 - 39;
      if (Math.hypot(bx - this.bx, by - this.by) < 60) { this.burst(bx, by, C.pink, 50); this.win(); }
    }

    for (const k of this.kisses) {
      k[0] += k[2]; k[1] += k[3];
      if (Math.hypot(k[0] - this.bx, k[1] - this.by) < 30) { this.hurt(); k[0] = -999; }
    }
    this.kisses = this.kisses.filter(k => k[0] > -40 && k[0] < W + 40 && k[1] > -40 && k[1] < H + 40);
  },

  // ------------------------------------------------------------ çizim
  draw() {
    ctx.save();
    if (this.shake > 0) { const m = this.shake * 0.7; ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }
    this.drawInner();
    for (const f of this.floats) {
      ctx.globalAlpha = Math.min(1, f.life / 20);
      const sc = f.life > 42 ? 1 + (f.life - 42) * 0.05 : 1;
      text(f.txt, f.size * sc, f.col, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (this.slow > 0 && this.state !== 'menu' && this.state !== 'map') {
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 10; ctx.strokeRect(5, 5, W - 10, H - 10);
    }
  },
  drawInner() {
    if (this.state === 'menu') { drawHome(this.scroll, this.t); this.drawMenu(); muteButton(); return; }
    if (this.state === 'map') { this.drawMap(); muteButton(); return; }
    if (this.race) {
      const z = this.race.mode === 'bed' ? 1 : 1.04 - 0.05 * this.race.zoomE;
      this.raceZ = z;
      ctx.save(); ctx.translate(W / 2, 320); ctx.scale(z, z); ctx.translate(-W / 2, -320);
      this.race.draw();
      ctx.restore();
      this.race.drawSpeed();
      for (const p of this.parts) circle(p[0], p[1], 4, p[5]);
      this.drawHud();
      if (this.state === 'over') this.drawOver();
      else if (this.state === 'win') this.drawWin();
      return;
    }
    drawLevelBg(this.lv, this.scroll, this.t);
    for (const it of this.items) (it[2] === 'k' ? drawCookie : drawEmzik)(it[0], it[1], this.t);
    for (const e of this.enemies) e.draw(this.t);
    for (const sl of this.slippers) drawSlipper(sl.x, sl.y, sl.rot);
    if (this.boss && this.boss.y < H + 200) this.boss.draw(this.t);
    if (this.state === 'ending' || this.state === 'win') drawDilan(this.momX, 300, this.t);
    for (const k of this.kisses) heart(k[0], k[1], 13, C.pink);
    for (const bub of this.bubbles) { circle(bub[0], bub[1], 9, C.white); ring(bub[0], bub[1], 9, '#96c8f0', 2); }
    drawDeniz(this.bx, this.by, this.t, this.inv > 0, this.shield);
    for (const p of this.parts) circle(p[0], p[1], 4, p[5]);
    if (this.state === 'boss') this.boss.drawQuote();
    this.drawHud();
    if (this.state === 'over') this.drawOver();
    else if (this.state === 'win') this.drawWin();
  },

  drawHud() {
    if (this.race) { this.race.drawHud(); this.drawBanner(); return; }
    for (let i = 0; i < 3; i++) heart(30 + i * 34, 30, 13, i < this.lives ? C.red : '#b4aaaa');
    drawEmzik(146, 34, 0);
    text((this.pac % 5) + '/5', 22, C.white, 184, 31);
    text('Puan: ' + this.score, 30, C.yellow, W - 20, 32, 'right');
    if (this.state === 'play') {
      const prog = Math.min(1, this.frame / this.lv.len);
      rrect(330, 20, 300, 20, 10, '#3c3232');
      if (prog > 0.03) rrect(330, 20, 300 * prog, 20, 10, C.pink);
      text('Biberona mesafe', 18, C.white, 480, 54);
    } else if (this.state === 'boss' && this.boss) {
      const b = this.boss;
      rrect(300, 18, 360, 22, 10, '#3c3232');
      if (b.hp > 0) rrect(300, 18, 360 * b.hp / b.max, 22, 10, C.red);
      text('Cansu Hala', 18, C.white, 480, 54);
    }
    this.drawBanner();
  },
  drawBanner() {
    if (this.banner > 0 && (this.state === 'play' || this.state === 'race')) {
      const a = Math.min(1, this.banner / 30);
      ctx.globalAlpha = a;
      rrect(W / 2 - 300, 170, 600, 120, 20, 'rgba(58,38,32,0.75)');
      text('Bölüm ' + this.lv.id + ': ' + this.lv.name, 50, C.yellow, W / 2, 210);
      text(this.lv.intro, 22, C.white, W / 2, 258);
      ctx.globalAlpha = 1;
    } else if (this.msgT > 0) {
      text(this.msg, this.race ? 26 : 30, C.white, W / 2, this.race ? 200 : 112);
    }
  },

  makeButtons(list) {
    const bw = 190, gap = 24, total = list.length * bw + (list.length - 1) * gap;
    this.buttons = list.map((b, i) => Object.assign({ x: W / 2 - total / 2 + i * (bw + gap), y: 420, w: bw, h: 60,
      sc: easeBack(Math.max(0, Math.min(1, (this.btnAge - i * 5) / 14))) }, b));
    for (const b of this.buttons) button(b);
  },

  drawOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
    text('Eyvah!', 72, C.yellow, W / 2, 170);
    text(this.race ? 'Deniz uyuyakaldı… Zzz' : 'Deniz yakalandı…', 36, C.white, W / 2, 245);
    text('Puan: ' + this.score, 30, C.white, W / 2, 300);
    if (this.endWait === 0) this.makeButtons([
      { label: 'Tekrar', fn: () => this.start(this.lv.id) },
      { label: 'Harita', col: '#9fd3f0', fn: () => this.goMap() }
    ]); else this.buttons = [];
  },

  drawWin() {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
    text('Bölüm ' + this.lv.id + ' tamamlandı!', 56, C.yellow, W / 2, 70);
    if (this.race && IMG.group.complete) {
      ctx.save(); ctx.translate(112, 182); ctx.scale(0.8, 0.8); ctx.rotate(-0.08);
      rrect(-92, -78, 184, 172, 6, C.white);
      ctx.drawImage(IMG.group, -82, -68, 164, 123);
      ctx.fillStyle = C.ink; ctx.font = `700 16px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Ankara anısı', 0, 74);
      ctx.restore();
    }
    for (let i = 0; i < 3; i++) {
      const appear = this.starAnim - 20 - i * 18;
      const on = i < this.stars && appear > 0;
      const sc = on ? Math.min(1.25, appear / 10) - Math.max(0, Math.min(0.25, (appear - 10) / 20)) : 1;
      star(W / 2 - 110 + i * 110, 170 + (i === 1 ? -14 : 0), 44 * sc, on ? C.yellow : '#6b6260');
    }
    text('Puan: ' + this.score + '   (' + this.bonusLabel + ' +' + this.bonus + ')', 30, C.white, W / 2, 262);
    text(this.stars < 3 ? '3 yıldız için ' + this.need3 + ' puan gerekiyor' : 'Mükemmel! Tam puan sayılır!', 22, '#ffe9a8', W / 2, 302);
    text('En iyi: ' + (SAVE.best[this.lv.id] || 0) + (this.newBest ? '  · Yeni rekor!' : ''), 22, C.white, W / 2, 336);
    if (this.endWait === 0) {
      const list = [
        { label: 'Tekrar', col: '#ffd0a8', fn: () => this.start(this.lv.id) },
        { label: 'Harita', col: '#9fd3f0', fn: () => this.goMap() }
      ];
      if (this.lv.id < LEVELS.length) list.push({ label: 'Sonraki ▶', fn: () => this.start(this.lv.id + 1) });
      this.makeButtons(list);
    } else this.buttons = [];
  },

  drawMenu() {
    text('Deniz’in Biberon Macerası', 62, C.yellow, W / 2, 72);
    drawDeniz(140, 300 + Math.sin(this.t * 0.08) * 10, this.t, false, 0);
    text('Deniz', 20, C.white, 140, 372);
    drawPerson(310, 300, this.t, Object.assign({}, SEZGIN, { img: IMG.sezgin }));
    drawPerson(470, 300, this.t, Object.assign({}, NAZIM, { img: IMG.nazim }));
    drawPerson(645, 300, this.t, Object.assign({ img: IMG.cansu, name: 'Cansu Hala', s: 1.3 }, CANSU));
    drawDilan(835, 300, this.t);
    text('Ekrana dokun, Deniz uçsun. Emzikleri topla, yaratıklardan kaç!', 22, C.white, W / 2, 432);
    if (Math.floor(this.t / 30) % 2 === 0) text('Başlamak için dokun', 34, C.white, W / 2, 490);
  },

  drawMap() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#9fd6f2'); g.addColorStop(0.55, '#d8f0fa'); g.addColorStop(0.56, '#9ccf78'); g.addColorStop(1, '#6fae55');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 4; i++) {
      const x = wrapX(i * 300 + this.t * 0.3, 1200) - 120;
      ell(x, 90 + (i % 2) * 40, 50, 20, C.white); ell(x + 35, 80 + (i % 2) * 40, 34, 18, C.white);
    }
    ell(140, 330, 260, 60, '#88c46a'); ell(820, 340, 300, 70, '#88c46a');
    for (const [tx, ty] of [[60, 280], [400, 420], [700, 440], [910, 270]]) {
      rrect(tx - 6, ty, 12, 34, 3, '#7a4e33'); circle(tx, ty - 8, 26, '#3c8a46');
    }
    // patika
    ctx.setLineDash([16, 14]); ctx.strokeStyle = '#f6e3b4'; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(MAP_NODES[0].x, MAP_NODES[0].y + 20);
    for (let i = 1; i < MAP_NODES.length; i++) {
      const a = MAP_NODES[i - 1], b = MAP_NODES[i];
      ctx.quadraticCurveTo((a.x + b.x) / 2, Math.max(a.y, b.y) + 120, b.x, b.y + 20);
    }
    ctx.stroke(); ctx.setLineDash([]); ctx.lineCap = 'butt';

    text('Bölüm Haritası', 52, C.yellow, W / 2, 48);
    let total = 0; for (const l of LEVELS) total += SAVE.stars[l.id] || 0;
    star(W - 120, 40, 18, C.yellow); text(total + '/' + LEVELS.length * 3, 28, C.white, W - 64, 42);

    for (const nd of MAP_NODES) {
      const real = nd.id <= LEVELS.length;
      const locked = !real || !isUnlocked(nd.id);
      const bob = !locked ? Math.sin(this.t * 0.06 + nd.id) * 4 : 0;
      drawHouse(nd.x, nd.y + bob, nd.id, locked);
      const name = real ? 'Bölüm ' + nd.id + ': ' + LEVELS[nd.id - 1].name : 'Yakında…';
      text(name, 22, locked ? '#e9e4e0' : C.white, nd.x, nd.y - 135);
      if (real) {
        const st = SAVE.stars[nd.id] || 0;
        for (let i = 0; i < 3; i++) star(nd.x - 40 + i * 40, nd.y + 80, 16, i < st ? C.yellow : '#6b6260');
        if (!locked && st === 0) text('Oyna!', 22, '#fff3b0', nd.x, nd.y + 112);
      }
    }
    // haritada Deniz, açık son bölümün yanında
    let cur = LEVELS.length; for (let i = LEVELS.length; i >= 1; i--) if (!(SAVE.stars[i] > 0)) cur = i;
    const cn = MAP_NODES[cur - 1];
    drawDeniz(Math.max(70, cn.x - 130), cn.y + 10 + Math.sin(this.t * 0.08) * 8, this.t, false, 0);
    if (this.msgT > 0) text(this.msg, 28, C.white, W / 2, 500);
    else text('Oynamak için bir eve dokun', 22, C.white, W / 2, 505);
  }
};
const MAP_NODES = [{ id: 1, x: 150, y: 300 }, { id: 2, x: 380, y: 245 }, { id: 3, x: 615, y: 300 }, { id: 4, x: 840, y: 245 }];
G.reset();

// ================================================================ giriş
let lastTap = 0;
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}
function onTap(pt) {
  const now = performance.now();
  if (now - lastTap > 80) { lastTap = now; G.tap(pt); }
}
window.addEventListener('pointerdown', e => { e.preventDefault(); onTap(toCanvas(e)); }, { passive: false });
window.addEventListener('keydown', e => {
  if (G.state === 'race' && (e.code === 'ArrowUp' || e.code === 'KeyW')) { e.preventDefault(); G.race.move(-1); return; }
  if (G.state === 'race' && (e.code === 'ArrowDown' || e.code === 'KeyS')) { e.preventDefault(); G.race.move(1); return; }
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') { e.preventDefault(); onTap(null); }
});
document.addEventListener('gesturestart', e => e.preventDefault());

// ================================================================ döngü (60 adım/sn)
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) {
    if (G.slow > 0) { G.slow--; G.slowTick = !G.slowTick; if (G.slowTick) G.update(); }
    else G.update();
    acc -= 1000 / 60;
  }
  G.draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__G = G;
</script>
